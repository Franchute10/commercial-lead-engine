[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "commercial-lead-engine"
version = "0.1.0"
description = "Local-first foundation for evidence-based commercial lead research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["SQLAlchemy>=2.0,<3", "pydantic>=2.10,<3", "typer>=0.15,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[project.scripts]
lead-engine = "lead_engine.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
